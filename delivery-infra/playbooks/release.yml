---
- name: Раскатить релиз на canary
  hosts: canary
  gather_facts: true
  become: true
  serial: "{{ canary_serial | default(rollout_serial | default(1)) }}"
  roles:
    - deploy

- name: Выдержка после canary
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Дождаться bake-time перед production
      ansible.builtin.pause:
        seconds: "{{ release_bake_seconds | int }}"

- name: Раскатить релиз на production
  hosts: production
  gather_facts: true
  become: true
  serial: "{{ rollout_serial | default(1) }}"
  roles:
    - deploy
