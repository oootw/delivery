---
- name: Подготовить data-plane хост
  hosts: dataplane
  gather_facts: true
  become: true
  roles:
    - base
    - postgres
    - app

  tasks:
    - name: Выполнить первичный деплой во время provision
      ansible.builtin.include_role:
        name: deploy
      when: provision_run_initial_deploy | bool
