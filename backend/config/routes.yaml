# yaml-language-server: $schema=../vendor/symfony/routing/Loader/schema/routing.schema.json

# This file is the entry point to configure the routes of your app.
# Methods with the #[Route] attribute are automatically imported.
# See also https://symfony.com/doc/current/routing.html

# To list all registered routes, run the following command:
#   bin/console debug:router

controllers:
    resource: ../src/Http/Action/
    prefix: /api/v1
    type: attribute
    exclude:
        - ../src/Http/Action/Authorize/
        - ../src/Http/Action/System/

system_controllers:
    resource: ../src/Http/Action/System/
    type: attribute

authorize_controllers:
    resource: ../src/Http/Action/Authorize/
    type: attribute
    prefix: /api/v1/auth

admin_controllers:
    resource: ../src/Http/Admin/
    type: attribute

# Роуты overlay подхватываются из custom/config/routes.yaml, если каталог custom существует.
custom_routes:
    resource: ../custom/config/routes.yaml
