# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    sms.api_key: '%env(SMS_API_KEY)%'
    sms.api_phone_number: '%env(SMS_API_PHONE_NUMBER)%'
    sms.api_url: '%env(SMS_API_URL)%'
    jwt.secret: '%env(JWT_SECRET)%'
    jwt.access_ttl: '%env(int:JWT_ACCESS_TTL)%'
    jwt.refresh_ttl: '%env(int:JWT_REFRESH_TTL)%'
    app.root_domain: '%env(APP_ROOT_DOMAIN)%'
    cloudpayments.public_id: '%env(CLOUDPAYMENTS_PUBLIC_ID)%'
    cloudpayments.api_secret: '%env(CLOUDPAYMENTS_API_SECRET)%'
    cloudpayments.api_url: '%env(CLOUDPAYMENTS_API_URL)%'
    pos.secret_key: '%env(APP_POS_SECRET_KEY)%'
    iiko.api_url: '%env(IIKO_API_URL)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # каждый провайдер меню POS помечается тегом — по нему их собирает PosMenuProviderRegistry
    _instanceof:
        App\Application\PosIntegration\Gateway\PosMenuProviderInterface:
            tags: ['app.pos_menu_provider']

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    App\Shared\Service\SMSManager\SMSManager:
        arguments:
            $apiKey: '%sms.api_key%'
            $apiPhoneNumber: '%sms.api_phone_number%'
            $apiUrl: '%sms.api_url%'

    App\Shared\Service\JWTManager\JWTManager:
        arguments:
            $secret: '%jwt.secret%'
            $accessTtl: '%jwt.access_ttl%'
            $refreshTtl: '%jwt.refresh_ttl%'

    App\Http\Workspace\WorkspaceContextListener:
        arguments:
            $rootDomain: '%app.root_domain%'
            $devHeaderAllowed: '%kernel.debug%'

    App\Infrastructure\CloudPayments\CloudPaymentsGateway:
        arguments:
            $publicId: '%cloudpayments.public_id%'
            $apiSecret: '%cloudpayments.api_secret%'
            $apiUrl: '%cloudpayments.api_url%'

    App\Application\Billing\Gateway\PaymentGatewayInterface: '@App\Infrastructure\CloudPayments\CloudPaymentsGateway'

    App\Http\Action\Subscription\StartSubscriptionAction:
        arguments:
            $cloudPaymentsPublicId: '%cloudpayments.public_id%'

    App\Http\Action\Order\PlaceOrderAction:
        arguments:
            $cloudPaymentsPublicId: '%cloudpayments.public_id%'

    App\Application\Order\Realtime\OrderRealtimeNotifierInterface: '@App\Infrastructure\Mercure\MercureOrderNotifier'

    App\Application\Order\WaitTime\WaitTimeRecalculatorInterface: '@App\Application\WaitTime\Service\WaitTimeRecalculator'

    App\Application\Order\Pricing\OrderPricingInterface: '@App\Application\Promotion\Service\PromotionPricing'

    App\Application\Order\Rewards\OrderRewardsInterface: '@App\Application\Loyalty\Service\OrderRewards'

    App\Shared\Service\Crypto\SecretCipher:
        arguments:
            $base64Key: '%pos.secret_key%'

    App\Infrastructure\Iiko\IikoMenuProvider:
        arguments:
            $apiUrl: '%iiko.api_url%'

    App\Application\PosIntegration\Gateway\PosMenuProviderRegistry:
        arguments:
            $providers: !tagged_iterator app.pos_menu_provider
