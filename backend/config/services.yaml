# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

imports:
    - { resource: '../custom/config/services.yaml', ignore_errors: not_found }

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    sms.api_key: '%env(SMS_API_KEY)%'
    sms.api_phone_number: '%env(SMS_API_PHONE_NUMBER)%'
    sms.api_url: '%env(SMS_API_URL)%'
    jwt.secret: '%env(JWT_SECRET)%'
    jwt.access_ttl: '%env(int:JWT_ACCESS_TTL)%'
    jwt.refresh_ttl: '%env(int:JWT_REFRESH_TTL)%'
    cloudpayments.public_id: '%env(CLOUDPAYMENTS_PUBLIC_ID)%'
    cloudpayments.api_secret: '%env(CLOUDPAYMENTS_API_SECRET)%'
    cloudpayments.api_url: '%env(CLOUDPAYMENTS_API_URL)%'
    yookassa.api_url: '%env(YOOKASSA_API_URL)%'
    pos.secret_key: '%env(APP_POS_SECRET_KEY)%'
    iiko.api_url: '%env(IIKO_API_URL)%'
    upload.root_dir: '%kernel.project_dir%/public/upload'
    upload.url_prefix: '/upload'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # каждый провайдер меню POS помечается тегом — по нему их собирает PosMenuProviderRegistry
    _instanceof:
        App\Application\PosIntegration\Gateway\PosMenuProviderInterface:
            tags: ['app.pos_menu_provider']
        # каждый клиентский модуль кастомизации помечается тегом — их собирает CustomModuleRegistry
        App\Application\Customization\Contract\CustomModuleInterface:
            tags: ['app.custom_module']
        # поставщики деклараций настроек воркспейса — их собирает SettingsCatalog
        App\Application\Customization\Settings\SettingsProviderInterface:
            tags: ['app.settings_provider']
        # разделы админки от клиентских модулей — их собирает DashboardController
        App\Http\Admin\CustomAdminMenuContributorInterface:
            tags: ['app.custom_admin_menu']

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    App\Shared\Service\SMSManager\SMSManager:
        arguments:
            $apiKey: '%sms.api_key%'
            $apiPhoneNumber: '%sms.api_phone_number%'
            $apiUrl: '%sms.api_url%'

    App\Shared\Service\JWTManager\JWTManager:
        arguments:
            $secret: '%jwt.secret%'
            $accessTtl: '%jwt.access_ttl%'
            $refreshTtl: '%jwt.refresh_ttl%'

    App\Http\Workspace\WorkspaceContextListener:
        arguments:
            $workspaceId: '%env(int:WORKSPACE_ID)%'

    App\Infrastructure\License\InMemoryServerLicenseRegistry:
        arguments:
            $registryJson: '%env(LICENSE_SERVER_REGISTRY)%'

    App\Application\License\Registry\ServerLicenseRegistryInterface: '@App\Infrastructure\License\InMemoryServerLicenseRegistry'

    App\Infrastructure\License\ControlPlaneLicenseClient:
        arguments:
            $controlPlaneUrl: '%env(CONTROL_PLANE_URL)%'
            $serverToken: '%env(SERVER_TOKEN)%'

    App\Application\License\Contract\ControlPlaneLicenseClientInterface: '@App\Infrastructure\License\ControlPlaneLicenseClient'

    App\Infrastructure\License\CachedLicenseProvider:
        arguments:
            $cache: '@cache.app'
            $cacheTtlSeconds: '%env(int:LICENSE_CACHE_TTL)%'
            $graceTtlSeconds: '%env(int:LICENSE_GRACE_TTL)%'

    App\Application\License\Contract\LicenseProviderInterface: '@App\Infrastructure\License\CachedLicenseProvider'

    App\Infrastructure\CloudPayments\CloudPaymentsGateway:
        arguments:
            $publicId: '%cloudpayments.public_id%'
            $apiSecret: '%cloudpayments.api_secret%'
            $apiUrl: '%cloudpayments.api_url%'

    App\Shared\Contract\Payment\PaymentGateway\PaymentGatewayInterface: '@App\Infrastructure\CloudPayments\CloudPaymentsGateway'

    App\Http\Action\Subscription\StartSubscriptionAction:
        arguments:
            $cloudPaymentsPublicId: '%cloudpayments.public_id%'

    App\Infrastructure\Payment\WorkspaceOrderPaymentGatewayFactory:
        arguments:
            $platformCloudPaymentsPublicId: '%cloudpayments.public_id%'
            $yooKassaApiUrl: '%yookassa.api_url%'

    App\Shared\Contract\Payment\OrderPaymentGateway\OrderPaymentGatewayResolverInterface: '@App\Infrastructure\Payment\WorkspaceOrderPaymentGatewayFactory'

    App\Infrastructure\YooKassa\YooKassaPaymentStatusResolver:
        arguments:
            $yooKassaApiUrl: '%yookassa.api_url%'

    App\Shared\Contract\Payment\OrderPaymentGateway\OrderPaymentStatusResolverInterface: '@App\Infrastructure\YooKassa\YooKassaPaymentStatusResolver'

    App\Application\Order\Realtime\OrderRealtimeNotifierInterface: '@App\Infrastructure\Mercure\MercureOrderNotifier'

    App\Application\Order\WaitTime\WaitTimeRecalculatorInterface: '@App\Application\WaitTime\Service\WaitTimeRecalculator'

    App\Application\Order\Pricing\OrderPricingInterface: '@App\Application\Promotion\Service\PromotionPricing'

    App\Application\Order\Rewards\OrderRewardsInterface: '@App\Application\Loyalty\Service\OrderRewards'

    App\Infrastructure\Storage\VenueLogoStorage:
        arguments:
            $uploadRootDir: '%upload.root_dir%'
            $uploadUrlPrefix: '%upload.url_prefix%'

    App\Application\Venue\Logo\VenueLogoStorageInterface: '@App\Infrastructure\Storage\VenueLogoStorage'

    App\Infrastructure\Storage\MenuImageStorage:
        arguments:
            $uploadRootDir: '%upload.root_dir%'
            $uploadUrlPrefix: '%upload.url_prefix%'

    App\Application\Menu\Image\MenuImageStorageInterface: '@App\Infrastructure\Storage\MenuImageStorage'

    App\Infrastructure\Storage\PromotionBannerStorage:
        arguments:
            $uploadRootDir: '%upload.root_dir%'
            $uploadUrlPrefix: '%upload.url_prefix%'

    App\Application\Promotion\Banner\PromotionBannerStorageInterface: '@App\Infrastructure\Storage\PromotionBannerStorage'

    App\Shared\Transaction\TransactionInterface: '@App\Infrastructure\Doctrine\Transaction\DoctrineTransaction'

    App\Application\Authorize\Gateway\SmsSenderInterface: '@App\Infrastructure\Messenger\Sms\QueuedSmsSender'

    App\Application\Authorize\Security\PasswordHasherInterface: '@App\Infrastructure\Security\AdminPasswordHasher'

    App\Shared\Service\Crypto\SecretCipher:
        arguments:
            $base64Key: '%pos.secret_key%'

    App\Infrastructure\Iiko\IikoMenuProvider:
        arguments:
            $apiUrl: '%iiko.api_url%'

    App\Application\PosIntegration\Gateway\PosMenuProviderRegistry:
        arguments:
            $providers: !tagged_iterator app.pos_menu_provider

    App\Application\Customization\Registry\CustomModuleRegistry:
        arguments:
            $modules: !tagged_iterator app.custom_module

    App\Application\Customization\Settings\SettingsCatalog:
        arguments:
            $providers: !tagged_iterator app.settings_provider
