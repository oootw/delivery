security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: "auto"

    providers:
        users_in_memory: { memory: null }
        app_user_provider:
            entity:
                class: App\Infrastructure\Doctrine\Domain\Users\User
                property: phone

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        admin:
            pattern: ^/admin
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: admin_login
                check_path: admin_login
                enable_csrf: true
                default_target_path: admin_dashboard
            logout:
                path: admin_logout
                target: admin_login

        api_auth:
            pattern: ^/api/v1/auth
            stateless: true
            security: false

        webhooks:
            pattern: ^/api/v1/webhooks
            stateless: true
            security: false

        api:
            pattern: ^/api/v1
            stateless: true
            # JwtAuthenticator использует SelfValidatingPassport и не обращается к
            # провайдеру, но при нескольких провайдерах Symfony требует указать его явно.
            provider: users_in_memory
            custom_authenticators:
                - App\Http\Security\JwtAuthenticator
            entry_point: App\Http\Security\JwtAuthenticator

        main:
            lazy: true
            security: false

    access_control:
        - { path: ^/api/v1/auth, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/webhooks, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/admin/login, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
