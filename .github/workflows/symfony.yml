name: Delivery Mono CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
    - uses: actions/checkout@v4
    - name: Check delivery-contracts
      run: php delivery-contracts/tools/contract_check.php

  control-plane:
    runs-on: ubuntu-latest
    steps:
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
    - uses: actions/checkout@v4
    - name: Install dependencies
      working-directory: delivery-control-plane
      run: composer install --no-interaction --prefer-dist
    - name: Contract compatibility
      run: php delivery-control-plane/tools/contract_compat_check.php

  core:
    runs-on: ubuntu-latest
    steps:
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
    - uses: actions/checkout@v4
    - name: Install dependencies
      working-directory: delivery-core
      run: composer install --no-interaction --prefer-dist
    - name: Contract compatibility
      run: php delivery-core/tools/contract_compat_check.php

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: 3003fylhtq3003
        ports:
          - 5466:5432
        options: >-
          --health-cmd="pg_isready -U app -d app"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://app:3003fylhtq3003@127.0.0.1:5466/app?serverVersion=16&charset=utf8
      WORKSPACE_ID: 1
      JWT_SECRET: test-jwt-secret
      JWT_ACCESS_TTL: 900
      JWT_REFRESH_TTL: 604800
      CONTROL_PLANE_URL: http://127.0.0.1
      SERVER_TOKEN: test-server-token
      LICENSE_CACHE_TTL: 300
      LICENSE_GRACE_TTL: 259200
      LICENSE_SERVER_REGISTRY: '[{"server_token":"test-server-token","owner_id":1001,"workspace_id":1,"tarif":"pro","status":"active","valid_until":"2030-01-01T00:00:00+00:00","features":["points","crm","analytics","support"]}]'
      APP_POS_SECRET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CLOUDPAYMENTS_PUBLIC_ID: test-public
      CLOUDPAYMENTS_API_SECRET: test-secret
      CLOUDPAYMENTS_API_URL: https://api.cloudpayments.ru
      YOOKASSA_API_URL: https://api.yookassa.ru/v3
      SMS_API_KEY: test
      SMS_API_PHONE_NUMBER: "+79001234567"
      SMS_API_URL: https://sms-provider.example.com/send
      IIKO_API_URL: https://api-ru.iiko.services
    steps:
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
    - uses: actions/checkout@v4
    - name: Install dependencies
      working-directory: backend
      run: composer install --no-interaction --prefer-dist
    - name: Validate container wiring
      working-directory: backend
      run: php bin/console lint:container --env=test
    - name: Validate doctrine schema
      working-directory: backend
      run: php bin/console doctrine:schema:validate --skip-sync --env=test
    - name: Run architecture boundary test
      working-directory: backend
      run: php vendor/bin/phpunit tests/Unit/Architecture/CustomizationBoundaryTest.php --configuration phpunit.dist.xml
    - name: Run contract compatibility checks
      working-directory: backend
      run: |
        php bin/console app:core:contract
        php vendor/bin/phpunit tests/Unit/Console/CoreContractCommandTest.php tests/Unit/Console/CustomCheckCompatCommandTest.php --configuration phpunit.dist.xml
