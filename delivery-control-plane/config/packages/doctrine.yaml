doctrine:
    dbal:
        url: '%env(DATABASE_URL)%'
        server_version: '16'
    orm:
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Infrastructure/Doctrine/Domain'
                prefix: 'App\Infrastructure\Doctrine\Domain'
                alias: App

